name: test-and-build

# Every push to main and every pull request: run the tests on macOS, Windows
# and Linux, then build the standalone app on each and upload it as an
# artifact (Actions run page -> Artifacts). Tags v* also attach the archives
# to a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Linux system libraries (PortAudio, Qt runtime)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/ci_run.py

      - name: Build and self-check
        if: success() || failure()          # build even when tests fail, to learn both
        env:
          CI: "1"
        run: python build.py --no-install

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() || failure()
        with:
          name: IcomRemote-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            build/check.log
          retention-days: 30
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Attach tested builds to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
